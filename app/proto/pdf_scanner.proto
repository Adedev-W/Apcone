syntax = "proto3";

package apcone.pdfscanner;

service PdfScanner {
  rpc OcrPdf (OcrPdfRequest) returns (OcrPdfResponse);
  rpc Health (HealthRequest) returns (HealthResponse);
}

message OcrPdfRequest {
  bytes pdf = 1;
  string filename = 2;
  string language = 3;
  string source_path = 4;
  repeated int32 pages = 5;
  string mode = 6;
}

message OcrPdfResponse {
  bytes pdf = 1;
  string parser_name = 2;
  string message = 3;
  string text = 4;
  repeated int32 pages_processed = 5;
  int64 duration_ms = 6;
  repeated string warnings = 7;
  repeated OcrPageText page_texts = 8;
}

message OcrPageText {
  int32 page = 1;
  string text = 2;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string message = 2;
}
