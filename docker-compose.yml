services:
  pdf-scanner:
    build:
      context: .
      dockerfile: docker/pdf-scanner/Dockerfile
    container_name: apcone-pdf-scanner
    restart: unless-stopped
    environment:
      PDF_SCANNER_GRPC_PORT: 50051
      PDF_SCANNER_LANGUAGE: ${PDF_SCANNER_LANGUAGE:-eng}
      PDF_SCANNER_MAX_MB: ${PDF_SCANNER_MAX_MB:-100}
    ports:
      - "127.0.0.1:${PDF_SCANNER_GRPC_PORT:-50051}:50051"

  postgres:
    image: postgres:18.4
    container_name: apcone-postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apcone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apcone_password}
      POSTGRES_DB: ${POSTGRES_DB:-apcone}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.6.3
    container_name: apcone-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: apcone-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
