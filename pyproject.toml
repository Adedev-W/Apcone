[project]
name = "apcone"
version = "0.1.0"
description = "Minimal FastAPI service with PostgreSQL and Redis."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.136.1",
    "fastmcp>=3.4.2",
    "httpx==0.28.1",
    "pydantic-settings==2.14.1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "pymupdf==1.27.1",
    "pdfplumber==0.11.9",
    "qdrant-client[fastembed]==1.18.0",
    "rq==2.7.0",
    "redis==7.4.0",
    "sqlalchemy==2.0.49",
    "uvicorn[standard]==0.47.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[tool.uv]
package = false
